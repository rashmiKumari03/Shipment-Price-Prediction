<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartShip Pricing: Shipment Price Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-section {
            background: url(r'C:\Users\Admin\Desktop\ineuron\Ineuron_Internships\Shipment_Price_Prediction\ref_images\timepass_img.png') no-repeat center center/cover;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }
        .form-container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">SmartShip Pricing</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Price Model</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <!-- Hero Section -->
    <div class="hero-section text-center">
        <video autoplay muted loop>
            <source src="ref_images/shipment_video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <h1>SmartShip Pricing : </h1>
        <h2>Shipment Price Prediction</h2>
    </div>


    <!-- Prediction Form -->
    <div class="container mt-5 form-container">
        <h2 class="text-center">Estimate Your Shipment Cost</h2>
        <form>
            <!-- Numerical Inputs -->
            <div class="mb-3">
                <label class="form-label">Line Item Quantity</label>
                <input type="number" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Line Item Value (USD)</label>
                <input type="number" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Pack Price (USD)</label>
                <input type="number" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Unit Price (USD)</label>
                <input type="number" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Weight (Kilograms)</label>
                <input type="number" class="form-control" required>
            </div>
            
            <!-- Categorical Inputs -->
            <div class="mb-3">
                <label class="form-label">Country</label>
                <select class="form-select" required>
                    <option selected disabled>Select Country</option>
                    <option>USA</option>
                    <option>India</option>
                    <option>Germany</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Shipment Mode</label>
                <select class="form-select" required>
                    <option selected disabled>Select Mode</option>
                    <option>Air</option>
                    <option>Sea</option>
                    <option>Land</option>
                </select>
            </div>
            
            <!-- Date Inputs -->
            <div class="mb-3">
                <label class="form-label">Scheduled Delivery Date</label>
                <input type="date" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Delivered to Client Date</label>
                <input type="date" class="form-control" required>
            </div>
            
            <!-- Binary Input -->
            <div class="mb-3">
                <label class="form-label">First Line Designation</label>
                <select class="form-select" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-success w-100">Predict Price</button>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

train_model:
  LinearRegression:
    fit_intercept:
    - true
    - false
    positive:
    - true
    - false
  Lasso:
    alpha:
    - 0.01
    - 0.1
    - 1.0
    max_iter:
    - 5000
  Ridge:
    alpha:
    - 0.01
    - 0.1
    - 1.0
    solver:
    - auto
    - lsqr
    max_iter:
    - 5000
  XGBRegressor:
    learning_rate:
    - 0.01
    - 0.1
    max_depth:
    - 5
    - 8
    n_estimators:
    - 100
    - 200
    booster:
    - gbtree
  AdaBoostRegressor:
    n_estimators:
    - 50
    - 150
    learning_rate:
    - 0.01
    - 0.1
base_model_score: '0.9731'

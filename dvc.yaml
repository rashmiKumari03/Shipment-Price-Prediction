# ================================================================
# Purpose: Define and track the ML pipeline stages using DVC
#
# What is this file for?
# -----------------------
# - This file declares the stages of your Machine Learning pipeline.
# - Each stage specifies:
#     * The command to run
#     * The input dependencies (deps)
#     * The output files or artifacts (outs), if any
#
# What are we tracking?
# -----------------------
# 1. We have already tracked:
#     - The raw and processed data (CSV, NPZ files)
#     - The trained model files (.pkl, etc.)
# 2. Now with this file:
#     - We are tracking the entire ML pipeline, step-by-step.
#     - DVC will manage the execution flow and caching.
#
# Why is this important?
# -----------------------
# - Ensures reproducibility: the same inputs always yield the same outputs.
# - Avoids redundant work: only changed parts of the pipeline are re-executed.
# - Enables collaborative and production-ready ML development.
# ================================================================


stages:
  data_ingestion:
    cmd: python -m src.Shipment_Price_Prediction.components.data_ingestion
    deps:
      - src/Shipment_Price_Prediction/components/data_ingestion.py
      - src/Shipment_Price_Prediction/entity/config_entity.py
      - src/Shipment_Price_Prediction/configuration/mongo_operation.py
    outs:
      - Artifacts/Data_Ingestion_Artifacts

  data_validation:
    cmd: python -m src.Shipment_Price_Prediction.components.data_validation
    deps:
      - src/Shipment_Price_Prediction/components/data_validation.py
      - Artifacts/Data_Ingestion_Artifacts
      - src/Shipment_Price_Prediction/entity/config_entity.py
      - src/Shipment_Price_Prediction/utils/main_utils.py
    outs:
      - Artifacts/Data_Validation_Artifacts

  data_transformation:
    cmd: python -m src.Shipment_Price_Prediction.components.data_transformation
    deps:
      - src/Shipment_Price_Prediction/components/data_transformation.py
      - Artifacts/Data_Validation_Artifacts
      - src/Shipment_Price_Prediction/entity/config_entity.py
      - src/Shipment_Price_Prediction/utils/main_utils.py
    outs:
      - Artifacts/Data_Transformation_Artifacts

  model_trainer:
    cmd: python -m src.Shipment_Price_Prediction.components.model_trainer
    deps:
      - src/Shipment_Price_Prediction/components/model_trainer.py
      - Artifacts/Data_Transformation_Artifacts
      - src/Shipment_Price_Prediction/entity/config_entity.py
      - src/Shipment_Price_Prediction/utils/main_utils.py
    # outs:
    #  - Artifacts/Model_Trainer_Artifacts    # This is intentionally not tracked since it stores intermediate models, not the final best model to be versioned.

  model_evaluation:
    cmd: python -m src.Shipment_Price_Prediction.components.model_evaluation
    deps:
      - src/Shipment_Price_Prediction/components/model_evaluation.py
      - Artifacts/Model_Trainer_Artifacts
      - src/Shipment_Price_Prediction/entity/config_entity.py
      - src/Shipment_Price_Prediction/utils/main_utils.py
  

  model_pusher:
    cmd: python -m src.Shipment_Price_Prediction.components.model_pusher
    deps:
      - src/Shipment_Price_Prediction/components/model_pusher.py
      - Artifacts/Model_Trainer_Artifacts
      - src/Shipment_Price_Prediction/configuration/s3_operation.py
      - src/Shipment_Price_Prediction/entity/config_entity.py
      - src/Shipment_Price_Prediction/utils/main_utils.py
  

  s3_to_local_model:
    cmd: python -m src.Shipment_Price_Prediction.components.s3_to_local_model
    deps:
      - src/Shipment_Price_Prediction/components/s3_to_local_model.py
      - src/Shipment_Price_Prediction/configuration/s3_operation.py
      - src/Shipment_Price_Prediction/entity/config_entity.py
      - src/Shipment_Price_Prediction/utils/main_utils.py
    outs:
      - Artifacts/S3_Best_Model_Artifacts
